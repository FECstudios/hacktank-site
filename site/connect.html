<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050000">
<title>Connect TikTok – tiq</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Squada+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<header class="auth-top">
  <a class="brand" href="./">tiq.</a>
  <a class="back" href="./">← back</a>
</header>

<main class="auth">
  <h1>VERIFY</h1>
  <p class="lead">Prove the TikTok account is yours by adding a code to your bio. Your profile must be public.</p>

  <div class="auth-card">
    <label for="username">Your TikTok username</label>
    <input type="text" id="username" placeholder="@tiktokusername" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button id="get-code">GET CODE</button>

    <div id="step2" class="step2" hidden>
      <p class="hint">Add this code to your TikTok bio. You can remove it after verification.</p>
      <code id="code" class="code-box"></code>
      <button id="copy" class="secondary">COPY</button>
      <button id="verify">I ADDED IT, VERIFY</button>
    </div>
    <p class="msg" id="msg"></p>
  </div>
</main>

<footer class="auth-foot">
  <a href="terms.html">Terms of Service</a> · <a href="privacy.html">Privacy Policy</a>
</footer>

<script type="module">
import { SUPABASE_URL, SUPABASE_KEY, FETCH_REPOSTS_URL } from "./config.js";

                // Supabase kütüphanesini internetten yüklemek:
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";


                // Supabase'e bağlanmak:
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const { data: { session } } = await supabase.auth.getSession();

 if (!session || !session.access_token) {
        location.href = "login.html";
  } else {

  // TikTok zaten bağlıysa tekrar sorma, doğrudan oyuna git
  const { data: me } = await supabase
    .from("profiles")
    .select("tiktok_username")
    .eq("id", session.user.id)
    .single();
  if (me?.tiktok_username) location.replace("app.html");
        const BIO_URL = SUPABASE_URL + "/functions/v1/bio-verify";
        async function call(body) {
          const res = await fetch(BIO_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + session.access_token },
            body: JSON.stringify(body),
          });
          return await res.json();
        }

        document.getElementById("get-code").addEventListener("click", async () => {
          const data = await call({ action: "start", username: document.getElementById("username").value });
          if(data.code){
            document.getElementById("code").textContent = data.code
            document.getElementById("step2").hidden = false
          }else{
            document.getElementById("msg").textContent = data.detail || data.error
          }
        });

        document.getElementById("copy").addEventListener("click", async () => {
            await navigator.clipboard.writeText(document.getElementById("code").textContent)
            document.getElementById("msg").textContent = "Copied!"
        });

        document.getElementById("verify").addEventListener("click", async () => {
            const verify = document.getElementById("verify")
            verify.disabled = true
            document.getElementById("msg").textContent = "Checking your bio... (~30s)"
            const data = await call({ action: "check"}).catch(() => ({ error: "network_error" }));
            if (data.ok){
              document.getElementById("msg").textContent = "Verified ✓ Loading your reposts…"
              await fetch(FETCH_REPOSTS_URL, {
                method: "POST",
                headers: { "Authorization": "Bearer " + session.access_token },
              }).catch(() => {});
              location.replace("app.html");
            } else {
              document.getElementById("msg").textContent = data.detail || data.error
              verify.disabled = false
            }
        });

  }

</script>
</body>
</html>
