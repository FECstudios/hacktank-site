    <!doctype html>
    <html lang="en">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Login – tiq</title>
            <link rel="stylesheet" href="style.css">
        </head>
        <body>
            <main>
                <p><a href="./">← tiq</a></p>
                <h1>LOGIN</h1>
                <p class="lead">Let's get you logged in</p>

                <div class="card">
                    <p>Enter your mail:</p>
                    <input type="email" id="email">
                    <button id="send">SEND</button>
                    <p id="message"></p>
                </div>





            <footer>
                <a href="terms.html">Terms of Service</a> · <a href="privacy.html">Privacy Policy</a>
            </footer>
            </main>





            <script type="module">

                // Supabase kütüphanesini internetten yüklemek:
                import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

                // config.js'ten adresi ve anahtarı almak:
                import { SUPABASE_URL, SUPABASE_KEY } from "./config.js";

                // Supabase'e bağlanmak:
                const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

                document.getElementById("send").onclick = async () => {
                    document.getElementById("send").disabled = true;

                    const { error } = await supabase.auth.signInWithOtp({
                        email: document.getElementById("email").value,
                        options: { emailRedirectTo: new URL("app.html", location.href).href },
                    });
                    if (error) {
                        console.log("ERR: " + error)
                        document.getElementById("message").textContent = "ERROR: " + error
                        document.getElementById("send").disabled = false;
                    } else {
                        document.getElementById("message").textContent = "Check your mail gng"
                        document.getElementById("send").disabled = false;
                        document.getElementById("send").textContent = "ReSend";
                    }
                    
                }

            </script>
        </body>
    </html>
